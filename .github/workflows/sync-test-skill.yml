name: Sync test-skill to project-a

on:
  push:
    branches:
      - main
    paths:
      - "plugins/test-skill/**"

  # Giữ lại để khi cần vẫn có thể chạy bằng tay
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout skill repository
        uses: actions/checkout@v5

      - name: Clone project-a
        env:
          GH_TOKEN: ${{ secrets.PROJECT_A_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Thien3920/project-a.git project-a

      - name: Copy test-skill
        run: |
          rm -rf project-a/.github/skills/test-skill
          mkdir -p project-a/.github/skills/test-skill

          cp -R \
            plugins/test-skill/skills/test-skill/. \
            project-a/.github/skills/test-skill/

      - name: Check for changes
        id: changes
        working-directory: project-a
        run: |
          if git diff --quiet -- .github/skills/test-skill; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No skill changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Skill changes detected."
          fi

      - name: Create or update sync branch
        if: steps.changes.outputs.changed == 'true'
        working-directory: project-a
        env:
          GH_TOKEN: ${{ secrets.PROJECT_A_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/sync-test-skill"

          git checkout -B "$BRANCH"

          git add .github/skills/test-skill
          git commit -m "chore: sync test-skill"

          git push --force origin "$BRANCH"

      - name: Create pull request if needed
        if: steps.changes.outputs.changed == 'true'
        working-directory: project-a
        env:
          GH_TOKEN: ${{ secrets.PROJECT_A_PAT }}
        run: |
          BRANCH="chore/sync-test-skill"

          EXISTING_PR=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists. Branch has been updated."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: sync test-skill" \
              --body "Automatically sync test-skill from the central AI Skill repository."
          fi