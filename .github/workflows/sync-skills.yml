name: Sync AI Skills

on:
  push:
    branches:
      - develop
    paths:
      - "skills/**"
      - "distribution/sync-targets.yml"
      - "scripts/sync-skills.sh"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AI_SKILL_SYNC_APP_ID }}
          private-key: ${{ secrets.AI_SKILL_SYNC_PRIVATE_KEY }}
          owner: Thien3920

      - name: Sync skills
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/sync-skills.sh